Nie uznawać żadnego elementu za zaimplementowany bez inspekcji kodu.

# 21. PIERWSZE ZADANIA DLA WORK

Po załadowaniu tego dokumentu:

1. Odszukaj źródło V0.2.5.
2. Zweryfikuj archiwum ZIP.
3. Rozpakuj do katalogu roboczego.
4. Zinwentaryzuj wszystkie pliki.
5. Sprawdź `build.gradle`, `gradle.properties`, `fabric.mod.json`.
6. Sprawdź klasy encji, itemu, renderera i zasoby.
7. Ustal dostępność Gradle Wrapper i Java 21.
8. Przygotuj katalog `~/Desktop/GSE` na Macu.
9. Wykonaj bazowy build.
10. Zapisz rzeczywisty wynik kompilacji.
11. Następnie rozpocznij implementację modelu `F18Model` i `F18Renderer`.

**Nie rozpoczynaj od pustego projektu, jeśli źródło V0.2.5 jest dostępne i nadaje się do dalszego rozwoju.**

