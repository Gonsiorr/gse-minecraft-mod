# 22. NAJWAŻNIEJSZA ZASADA

GSE ma być modem żeglarskim, a nie tylko łodzią z teksturą.

Priorytetem jest działający, spójny system:
- modelu;
- sterowania;
- wiatru;
- fizyki;
- załogi;
- wyposażenia;
- progresji;
- craftingu;
- trwałości danych.

Każdy etap powinien kończyć się możliwym do zweryfikowania rezultatem.

Nie deklarować gotowości bez kompilacji i testów.
