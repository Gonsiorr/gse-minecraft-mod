# 18. HUD I STEROWANIE

## 18.1. HUD

HUD znajduje się u góry ekranu i jest widoczny wyłącznie dla sternika.

Pokazuje:
- prędkość w blokach/s;
- wiatr w Kt i Bft;
- kierunek wiatru;
- kierunek dziobu;
- kąt względem wiatru;
- pasek trymu;
- zielone pasmo optimum;
- kropkę aktualnego trymu;
- wychylenie steru od 100% w lewo przez 0 do 100% w prawo;
- stan żagli;
- stan gennakera;
- stan kotwicy.

Bez ostrzeżeń, porad i komunikatów podpowiadających graczowi, co ma zrobić.

## 18.2. Sterowanie

| Akcja | Sterowanie |
|---|---|
| Sterowanie lewo/prawo | A / D |
| Wybieranie żagli | W |
| Luzowanie żagli | S |
| Podnoszenie/opuszczanie żagli | R |
| Gennaker | G |
| Kotwica | H |
| Wysiadanie | Shift + X |
| Zmiana miejsca/przekazanie steru | Shift + prawy przycisk |
| Wsiadanie pasażera | prawy przycisk |
| Wsiadanie sternika | Shift + prawy przycisk |

Sterowanie musi być remapowalne w standardowym ekranie sterowania Minecrafta i obsługiwać ostrzeżenia o konfliktach klawiszy.

